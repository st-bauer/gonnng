<title>Gonnng! Intro (Code)</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#07060f;--ink:#efe9ff;--muted:#9a90c0;--line:#3a3160;--gold:#f0b848;color-scheme:dark}
html,body{background:var(--bg);margin:0}
[hidden]{display:none!important}
body{color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;padding:16px 16px 28px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-size:26px;color:var(--gold);letter-spacing:.04em;text-shadow:2px 2px 0 #3a1c06;font-weight:700}
.sub{font-size:15px;color:var(--muted)}
.screen{position:relative;width:100%;aspect-ratio:16/10;background:#000;border:2px solid var(--line);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,4,14,.84);text-align:center;padding:16px;cursor:default}
.overlay h1{margin:0;font-size:clamp(34px,8vw,72px);color:var(--gold);letter-spacing:.04em;text-shadow:4px 4px 0 #3a1c06}
.overlay p{margin:0;font-size:clamp(14px,2.4vw,19px);color:#c9c0ea;max-width:44ch;line-height:1.35}
.primary,button{font-family:inherit;font-size:16px;color:var(--ink);background:#14102a;border:1px solid var(--line);border-radius:4px;padding:6px 14px;cursor:pointer}
.primary{font-size:20px;background:#2a1c4a;border-color:#8a6ad8;padding:8px 22px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:14px;color:var(--muted);margin-left:auto}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">Gonnng!</div>
    <div class="sub">Intro · Die Nacht, in der die Uhr stehen blieb · alles im Code gezeichnet</div>
  </div>
  <div class="screen" id="screen">
    <canvas id="cv" width="320" height="200" aria-label="Zwischensequenz: Eine Gestalt im Morgenmantel stiehlt nachts die Unruh aus der Schulturmuhr"></canvas>
    <div class="overlay" id="start">
      <h1>Gonnng!</h1>
      <p>Das Intro dauert rund 70 Sekunden. Mit Ton ist es am schönsten.</p>
      <button class="primary" id="play">Intro abspielen</button>
    </div>
    <div class="overlay" id="end" hidden>
      <h1>Gonnng!</h1>
      <p>Ende des Intros. Hier beginnt der Prolog im Klassenzimmer.</p>
      <button class="primary" id="again">Nochmal ansehen</button>
    </div>
  </div>
  <div class="controls">
    <button id="skip">Intro überspringen</button>
    <button id="mute" aria-pressed="false">Ton aus</button>
    <span class="hint">Tippen oder Leertaste: weiter zum nächsten Satz oder zur nächsten Szene</span>
  </div>
</div>

<script>
(()=>{
const W=320,H=200,SH=144,TOP=28,END=70.3;   // Szenen 320 x 144 mit schwarzen Balken oben und unten
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const bay=(x,y)=>(BAYER[y&3][x&3]+0.5)/16;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g];}

/* =====================================================================
   Pixel-Werkzeuge: alles wird Pixel fuer Pixel mit festen Farben gesetzt
   ===================================================================== */
function P(g,x,y,c){g.fillStyle=c;g.fillRect(x|0,y|0,1,1);}
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);}
// Flaeche mit Farbverlauf ueber mehrere Farben, geordnet gerastert wie bei VGA
function dith(g,x0,y0,w,h,cols,f){
  const n=cols.length-1;
  for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++){
    const t=clamp(f(x,y),0,0.9999)*n,k=Math.floor(t);
    P(g,x,y,(t-k)>bay(x,y)?cols[Math.min(n,k+1)]:cols[k]);
  }
}
function inPoly(px,py,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))c=!c;}return c;}
function polyFill(g,pts,colFn){
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  for(let y=Math.floor(Math.min(...ys));y<=Math.ceil(Math.max(...ys));y++)for(let x=Math.floor(Math.min(...xs));x<=Math.ceil(Math.max(...xs));x++)
    if(inPoly(x+0.5,y+0.5,pts)){const c=colFn(x,y);if(c)P(g,x,y,c);}
}
function ellFill(g,cx,cy,rx,ry,colFn){
  for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
    const dx=(x+0.5-cx)/rx,dy=(y+0.5-cy)/ry;if(dx*dx+dy*dy<=1){const c=colFn(x,y,dx,dy);if(c)P(g,x,y,c);}}
}
function line(g,x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let n=0;n<999;n++){P(g,x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}

/* ---------- Farbrampen: dunkel, Schatten, Grundton, Licht ---------- */
const RAMP={
  skin:['#6a3424','#b86e50','#e0a07a','#f8c8a0'],
  hairRed:['#4a1408','#9a3014','#d4521c','#f07a34'],
  hood:['#5a3c0c','#b08420','#e0b030','#f8dc68'],
  hoodD:['#3a2808','#6a4c10','#b08420','#d0a02c'],
  jeans:['#101838','#243664','#34508c','#4e70b0'],
  jeansD:['#0a1028','#18264c','#243664','#34508c'],
  shoe:['#3a0a0e','#8a1a20','#c83030','#e86050'],
  white:['#48485a','#a0a0b4','#d8d8e4','#ffffff'],
  bag:['#1e2410','#3e4a20','#5a6a2e','#7a8c44'],
  teal:['#08302e','#146058','#1e8474','#34a894'],
  skirt:['#2e1408','#6a3418','#8e4a22','#b0683a'],
  grey:['#383840','#6e6e7c','#9a9aa8','#c8c8d4'],
  blouse:['#4a3a58','#9a86b4','#c4b4dc','#ece0f8'],
  book:['#0a1440','#1c3278','#2c4ca8','#4a70d0'],
  bshoe:['#1e0e06','#4a2410','#6a3a1c','#8a5430'],
  chair:['#2a1408','#5a3218','#7e4a24','#a06a38'],
  stripe:['#0e3018','#20622e','#2e8a40','#50b060'],
  hairBr:['#1e1008','#3e2410','#5e3a1c','#7e5430'],
  trous:['#2a2a34','#50505e','#6e6e80','#9090a0'],
  lilac:['#2e1240','#5c2a7a','#8a44aa','#b070d0'],
  lilacD:['#200a30','#44205c','#5c2a7a','#8a44aa'],
  braid:['#0e0a10','#241a24','#3a2c38','#54444e'],
  boot:['#4a3a04','#9a7a10','#d8b020','#f8e060'],
  legg:['#0e0e18','#1e1e2e','#30304a','#484866'],
  raven:['#04040a','#10141e','#1c2434','#34466a'],
  beak:['#1a1a1e','#3a3a44','#5a5a66','#8a8a98'],
  gold:['#4a3408','#9a7418','#d8b040','#fff0a0'],
  tie:['#300610','#6a1024','#a02234','#d04a5a'],
  imp:['#3a2e48','#6a5a80','#9a88ae','#c4b6d4'],
  paj:['#1a3060','#3a64a4','#6a94d4','#a8c8f0'],
  cap:['#10245a','#26489a','#3a64c4','#6090e0'],
  wood:['#2a160c','#5c341c','#845028','#b07c48']
};
const OUT='#0c0a14';

/* ---------- Figuren aus Einzelteilen ----------
   Jedes Teil wird als Maske gezeichnet und dann mit Licht von links oben schattiert.
   Zum Schluss bekommt die ganze Figur eine dunkle Umrisslinie wie bei LucasArts. */
class Pup{
  constructor(w,h){this.w=w;this.h=h;this.c=new Array(w*h).fill(null);}
  part(ramp,fn,sep){
    const w=this.w,h=this.h,m=new Uint8Array(w*h);
    const set=(x,y)=>{x|=0;y|=0;if(x>=0&&y>=0&&x<w&&y<h)m[y*w+x]=1;};
    const api={
      ell:(cx,cy,rx,ry)=>{for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+0.5-cx)/rx,dy=(y+0.5-cy)/ry;if(dx*dx+dy*dy<=1)set(x,y);}},
      rect:(x,y,rw,rh)=>{for(let j=0;j<rh;j++)for(let i=0;i<rw;i++)set(x+i,y+j);},
      poly:(pts)=>{const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);for(let y=Math.floor(Math.min(...ys));y<=Math.ceil(Math.max(...ys));y++)for(let x=Math.floor(Math.min(...xs));x<=Math.ceil(Math.max(...xs));x++)if(inPoly(x+0.5,y+0.5,pts))set(x,y);},
      limb:(x1,y1,x2,y2,r1,r2)=>{const n=Math.max(2,Math.ceil(Math.hypot(x2-x1,y2-y1)*2));for(let i=0;i<=n;i++){const t=i/n,cx=x1+(x2-x1)*t,cy=y1+(y2-y1)*t,r=r1+(r2-r1)*t;api.ell(cx,cy,r,r);}},
      px:(x,y)=>set(x,y)
    };
    fn(api);
    const inm=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&m[y*w+x];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      if(!m[y*w+x])continue;
      const L=!inm(x-1,y)||!inm(x,y-1),D=!inm(x+1,y)||!inm(x,y+1),D2=!inm(x+2,y)||!inm(x,y+2);
      let col=ramp[2];
      if(D)col=ramp[1];else if(L)col=ramp[3];else if(D2&&(x+y)%2)col=ramp[1];
      if(sep){for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){const nx=x+dx,ny=y+dy;if(!inm(nx,ny)&&nx>=0&&ny>=0&&nx<w&&ny<h&&this.c[ny*w+nx]){if(dx>0||dy>0)col=ramp[0];}}}
      this.c[y*w+x]=col;
    }
    return this;
  }
  px(x,y,col){if(x>=0&&y>=0&&x<this.w&&y<this.h)this.c[y*this.w+x]=col;return this;}
  canvas(){
    const w=this.w,h=this.h,c=this.c.slice();
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(this.c[y*w+x])continue;
      if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<w&&ny<h&&this.c[ny*w+nx]&&this.c[ny*w+nx]!==OUT;}))c[y*w+x]=OUT;}
    const [cv2,g]=mk(w,h);for(let i=0;i<c.length;i++)if(c[i])P(g,i%w,Math.floor(i/w),c[i]);
    return cv2;
  }
}

/* ---------- Hauptfigur: 32 x 48, Fusspunkt (16,46), schaut nach rechts ---------- */
function makeHero(o){
  const p=new Pup(32,48),ph=o.phase||0,walk=o.walk;
  const a=walk?Math.sin(ph*Math.PI*2)*0.5:0;
  const bob=walk?Math.round(Math.abs(Math.cos(ph*Math.PI*2))):0;
  const legs=[[a,true],[-a,false]];   // [Winkel, vorn]
  const hipY=31-bob;
  const leg=(ang,front)=>{
    const hx=front?17:15,fx=hx+Math.sin(ang)*9,lift=walk&&ang<-0.1?2:0,fy=43-lift;
    const kx=(hx+fx)/2+(ang<0?1:0.5),ky=(hipY+fy)/2;
    const r=front?RAMP.jeans:RAMP.jeansD;
    p.part(r,m=>{m.limb(hx,hipY,kx,ky,2.4,2.2);m.limb(kx,ky,fx,fy-2,2.2,2);},!front);
    p.part(RAMP.jeans,m=>m.ell(fx,fy-2.5,2.6,1.2));
    p.part(RAMP.white,m=>m.rect(Math.round(fx-1),Math.round(fy-2),3,1));
    p.part(RAMP.shoe,m=>m.ell(fx+1.4,fy+0.2,3.3,1.8),true);
    p.px(Math.round(fx-1),Math.round(fy+1),'#e8e8f0').px(Math.round(fx),Math.round(fy+1),'#e8e8f0').px(Math.round(fx+1),Math.round(fy+1),'#e8e8f0').px(Math.round(fx+2),Math.round(fy+1),'#e8e8f0').px(Math.round(fx+3),Math.round(fy+1),'#e8e8f0');
  };
  const arm=(front)=>{
    const sx=front?17:15,sy=19-bob;
    let hx,hy;
    if(o.reach&&front){hx=sx+9;hy=sy+2;}
    else{const ang=walk?(front?-a:a)*0.9:(front?0.08:-0.08);hx=sx+Math.sin(ang)*9;hy=sy+Math.cos(ang)*9;}
    p.part(front?RAMP.hood:RAMP.hoodD,m=>m.limb(sx,sy,hx,hy,2.1,1.8),front);
    p.part(RAMP.skin,m=>m.ell(hx+(o.reach&&front?1:0),hy+1,1.7,1.7),front);
  };
  arm(false);
  leg(legs[1][0],false);
  p.part(RAMP.bag,m=>{m.rect(5,18-bob,6,12);m.ell(8,18-bob,3,2);});
  p.px(6,31-bob,'#d8b040').px(6,30-bob,'#9a9aa8');
  p.part(RAMP.hood,m=>{m.poly([[11,17-bob],[21,17-bob],[23,23-bob],[23,31-bob],[10,31-bob],[10,22-bob]]);m.ell(11,17-bob,3.2,2.6);});
  p.px(19,19-bob,'#ffffff').px(19,20-bob,'#ffffff').px(20,19-bob,'#ffffff').px(20,21-bob,'#ffffff');
  for(let x=16;x<23;x++)p.px(x,26-bob,'#b08420');
  leg(legs[0][0],true);
  arm(true);
  // Kopf
  p.part(RAMP.skin,m=>{m.rect(15,15-bob,4,3);m.ell(17,10-bob,6,6.3);m.ell(23,10-bob,1.4,1.6);});
  p.part(RAMP.skin,m=>m.ell(14,10-bob,1.4,2),true);
  p.part(RAMP.hairRed,m=>{m.ell(15,5-bob,7.2,4.6);m.poly([[8,3-bob],[11,9-bob],[8,11-bob],[10,6-bob]]);m.poly([[18,0-bob],[24,3-bob],[22,6-bob],[17,4-bob]]);m.poly([[10,0-bob],[13,-2-bob],[14,3-bob]]);m.poly([[22,2-bob],[25,1-bob],[24,5-bob]]);m.ell(11,9-bob,2.4,3.5);});
  // Bleistift hinterm Ohr
  line({fillRect:(x,y)=>p.px(x,y,'#e8c040'),set fillStyle(v){}},12,5-bob,16,4-bob,'#e8c040');p.px(17,4-bob,'#303030');
  // Gesicht
  const blink=o.blink;
  if(blink){p.px(20,9-bob,'#6a3424').px(21,9-bob,'#6a3424');}
  else{p.px(20,8-bob,'#ffffff').px(20,9-bob,'#ffffff').px(21,8-bob,'#101018').px(21,9-bob,'#101018');}
  p.px(19,7-bob,'#9a3014').px(20,7-bob,'#9a3014').px(21,7-bob,'#9a3014');
  p.px(19,11-bob,'#c07050').px(21,12-bob,'#c07050').px(18,12-bob,'#c07050');
  if(o.talk){p.px(21,13-bob,'#3a0a0e').px(22,13-bob,'#3a0a0e').px(21,14-bob,'#3a0a0e').px(22,14-bob,'#7a2a2e');}
  else{p.px(21,14-bob,'#8a4034').px(22,13-bob,'#8a4034');}
  return p.canvas();
}

/* ---------- Frau Kallweit: 32 x 56, Fusspunkt (15,55) ---------- */
function makeKallweit(o){
  const p=new Pup(32,56);
  p.part(RAMP.skin,m=>{m.rect(12,46,2,6);m.rect(17,46,2,6);});
  p.part(RAMP.bshoe,m=>{m.ell(13,53,2.6,1.5);m.ell(18.5,53,2.6,1.5);},true);
  p.part(RAMP.skirt,m=>m.poly([[9,30],[21,30],[24,47],[6,47]]));
  for(let y=33;y<47;y+=3)p.px(12,y,'#6a3418').px(18,y+1,'#6a3418');
  p.part(RAMP.teal,m=>m.limb(10,19,12,27,2,1.8));
  p.part(RAMP.teal,m=>{m.poly([[9,17],[21,17],[22,31],[8,31]]);});
  p.part(RAMP.blouse,m=>m.poly([[13,17],[17,17],[16,30],[14,30]]));
  for(let y=19;y<30;y+=3)p.px(15,y,'#6a5a88');
  // Buch in der linken Hand
  p.part(RAMP.book,m=>{m.poly([[6,24],[12,22],[18,24],[18,30],[12,28],[6,30]]);},true);
  p.part(RAMP.white,m=>{m.poly([[7,24],[12,23],[12,27],[7,29]]);m.poly([[12,23],[17,24],[17,29],[12,27]]);});
  p.part(RAMP.skin,m=>m.ell(11,26,1.7,1.6),true);
  // rechter Arm mit erhobenem Zeigefinger
  p.part(RAMP.teal,m=>m.limb(20,19,25,12,2,1.8),true);
  p.part(RAMP.skin,m=>{m.ell(25,11,1.8,1.8);m.rect(25,6,1,4);});
  // Kopf
  p.part(RAMP.skin,m=>{m.rect(14,14,3,4);m.ell(15.5,9,5,6);m.ell(20.5,10,1.2,1.4);});
  p.part(RAMP.grey,m=>{m.ell(15,4.5,5.6,3);m.ell(14,1.6,2.8,2.2);m.ell(10.5,8,1.6,3.2);});
  p.px(12,0,'#d8b040').px(13,0,'#d8b040').px(16,-0,'#303030');
  line({fillRect:(x,y)=>p.px(x,y,'#d8b040'),set fillStyle(v){}},11,0,17,2,'#d8b040');
  // Brille, Augen, offener Mund
  p.px(16,8,'#383840').px(17,8,'#383840').px(18,8,'#383840').px(19,8,'#383840').px(20,8,'#383840');
  p.px(17,9,'#ffffff').px(18,9,'#101018').px(19,9,'#383840');
  p.px(17,7,'#6e6e7c').px(18,7,'#6e6e7c');
  if(o.talk){p.px(18,12,'#3a0a0e').px(19,12,'#3a0a0e').px(18,13,'#3a0a0e');}
  else{p.px(18,12,'#3a0a0e').px(19,12,'#3a0a0e').px(18,13,'#3a0a0e').px(19,13,'#7a2a2e');}
  return p.canvas();
}

/* ---------- Jonas von hinten auf dem Stuhl, Arm oben: 30 x 50 ---------- */
function makeJonas(o){
  const p=new Pup(30,50),s=o.shake||0;
  p.part(RAMP.trous,m=>{m.rect(8,32,4,5);m.rect(18,32,4,5);});
  p.part(RAMP.stripe,m=>{m.poly([[8,19],[21,19],[22,33],[7,33]]);});
  for(let y=21;y<33;y+=3)for(let x=7;x<23;x++)if(p.c[y*30+x])p.px(x,y,'#e8e8f0');
  p.part(RAMP.stripe,m=>m.limb(9,21,8,29,2,1.8),true);
  p.part(RAMP.stripe,m=>m.limb(20,21,22+s,8,2.1,1.9),true);
  p.part(RAMP.skin,m=>{m.limb(22+s,8,23+s,2,1.5,1.4);m.ell(23+s,1.6,1.9,1.9);});
  p.part(RAMP.skin,m=>{m.rect(13,16,4,3);m.ell(9.2,12,1.3,1.8);m.ell(20,12,1.3,1.8);});
  p.part(RAMP.hairBr,m=>{m.ell(14.6,11,5.6,6.2);});
  p.px(14,4,'#7e5430').px(15,3,'#5e3a1c').px(16,4,'#7e5430').px(15,4,'#7e5430');
  // Stuhllehne vor dem Ruecken
  p.part(RAMP.chair,m=>{m.rect(6,25,18,4);m.rect(6,25,2,24);m.rect(22,25,2,24);m.rect(6,36,18,2);},true);
  return p.canvas();
}

/* ---------- Lina gaehnend auf dem Stuhl, seitlich: 38 x 46 ---------- */
function makeLina(){
  const p=new Pup(38,46);

/* ---------- Kraechz: 22 x 20, schaut nach links, Fusspunkt (11,19) ---------- */
function makeRaven(o){
  const p=new Pup(22,20),k=o.knock?-2:0;
  p.part(RAMP.raven,m=>{m.poly([[13,10],[21,15],[20,17],[12,13]]);});
  p.part(RAMP.beak,m=>{m.limb(10,15,9,19,0.6,0.6);m.limb(13,15,13,19,0.6,0.6);});
  p.part(RAMP.raven,m=>m.ell(11,11,5.4,4.4));
  p.part(RAMP.raven,m=>m.limb(12,9,17,14,2.2,1.4),true);
  p.part(RAMP.raven,m=>m.ell(7+k,6,3.6,3.4));
  p.part(RAMP.beak,m=>{m.poly([[4+k,5],[0+k,6.5],[4+k,7.4]]);});
  if(o.talk)p.px(1+k,7,'#0c0a14').px(2+k,7,'#0c0a14');
  p.part(RAMP.tie,m=>m.poly([[8,9],[11,9],[9.5,13]]));
  p.px(9,10,'#d8b040');
  // Monokel mit Kette
  p.px(5+k,4,'#d8b040').px(6+k,4,'#d8b040').px(4+k,5,'#d8b040').px(7+k,5,'#d8b040').px(5+k,6,'#d8b040').px(6+k,6,'#d8b040');
  p.px(5+k,5,'#e8f0ff').px(6+k,5,'#101018');
  p.px(7+k,7,'#9a7418').px(8,8,'#9a7418');
  return p.canvas();
}

/* ---------- Aufschiebchen: 24 x 28, schaut nach rechts, Fusspunkt (11,27) ---------- */
function makeImp(o){
  const p=new Pup(24,28),ph=o.phase||0,walk=o.walk,b=walk?Math.round(Math.abs(Math.sin(ph*Math.PI*2))):0;
  const f=walk?Math.sin(ph*Math.PI*2)*2.5:0;
  p.part(RAMP.imp,m=>{m.limb(9,21-b,9-f,25,1.3,1.2);m.limb(13,21-b,13+f,25,1.3,1.2);});
  p.part(RAMP.white,m=>{m.ell(9-f,25.5,2.2,1.3);m.ell(13.5+f,25.5,2.2,1.3);},true);
  p.part(RAMP.paj,m=>m.ell(11,18-b,5,4.5));
  for(let x=7;x<16;x+=2)for(let y=15-b;y<22-b;y++)if(p.c[y*24+x])p.px(x,y,'#a8c8f0');
  p.part(RAMP.imp,m=>m.ell(11,9-b,6,5.8));
  p.part(RAMP.imp,m=>m.ell(17,10-b,2.1,2),true);
  p.part(RAMP.cap,m=>{m.poly([[5,6-b],[16,4-b],[12,0-b],[4,2-b],[1,9-b]]);});
  p.part(RAMP.white,m=>m.ell(1.6,10-b,1.7,1.7),true);
  if(o.yawn){p.px(13,12-b,'#3a0a0e').px(14,12-b,'#3a0a0e').px(13,13-b,'#3a0a0e').px(14,13-b,'#7a2a2e');p.px(13,8-b,'#3a2e48').px(14,8-b,'#3a2e48');}
  else{p.px(13,8-b,'#ffffff').px(14,8-b,'#101018').px(13,7-b,'#6a5a80').px(14,7-b,'#6a5a80').px(12,12-b,'#3a2e48').px(13,12-b,'#3a2e48').px(14,11-b,'#3a2e48');}
  p.part(RAMP.imp,m=>m.ell(16,17-b,1.6,1.6),true);
  if(o.heft){p.part(['#6a5a10','#b09a30','#e8d070','#fff0a0'],m=>m.rect(14,14-b,7,5),true);}
  return p.canvas();
}

function drawWindow(g){
  const x0=10,y0=12,w=46,h=68,cx=x0+w/2;
  const inWin=(x,y)=>x>=x0&&x<x0+w&&y>=y0+18&&y<y0+h||Math.hypot(x+0.5-cx,y+0.5-(y0+23))<23&&y<y0+23;
  for(let y=y0-3;y<y0+h+3;y++)for(let x=x0-3;x<x0+w+3;x++){
    const inner=inWin(x,y),outer=inWin(x-3,y)||inWin(x+3,y)||inWin(x,y-3)||inWin(x,y+3);
    if(inner){
      let col;const t=(y-y0)/h;
      col=t<0.3?COL.sky[0]:t<0.55?COL.sky[1]:t<0.75?COL.sky[2]:COL.sky[3];
      if((t*4%1)>bay(x,y)&&t<0.99)col=COL.sky[Math.min(3,Math.floor(t*4)+1)]||col;
      // Daecher der Stadt im Morgendunst
      const roof=y0+h-10-Math.round(4*Math.abs(Math.sin(x/6)))-(x>36&&x<44?8:0);
      if(y>roof)col=y>roof+3?'#8a9ab8':'#a05a4a';
      if(x>=39&&x<42&&y>y0+h-26&&y<=roof)col='#7a8aa8';
      P(g,x,y,col);
    }else if(outer)P(g,x,y,(x<cx?'#ffffff':'#b8b8c8'));
  }
  // Fensterkreuz
  R(g,cx-1,y0,2,h,'#e0e0ea');R(g,cx,y0,1,h,'#9a9aa8');R(g,x0,y0+34,w,2,'#e0e0ea');R(g,x0,y0+35,w,1,'#9a9aa8');
  // Fensterbank mit Pflanze
  R(g,x0-6,y0+h+2,w+12,3,'#e0e0ea');R(g,x0-6,y0+h+2,w+12,1,'#ffffff');R(g,x0-6,y0+h+5,w+12,1,'#6e6e7c');
  R(g,14,y0+h-3,7,5,'#a05030');R(g,14,y0+h-3,7,1,'#c87050');
  ellFill(g,17,y0+h-7,5,4,(x,y,dx,dy)=>dx+dy<-0.2?'#5ab05a':'#2e7a2e');
}

class PupK extends Pup{
  constructor(w,h,k){super(Math.max(1,Math.ceil(w*k)),Math.max(1,Math.ceil(h*k)));this.k=k;}
  part(ramp,fn,sep){
    const k=this.k;
    return super.part(ramp,m=>fn({
      ell:(cx,cy,rx,ry)=>m.ell(cx*k,cy*k,Math.max(0.6,rx*k),Math.max(0.6,ry*k)),
      rect:(x,y,w,h)=>m.rect(Math.round(x*k),Math.round(y*k),Math.max(1,Math.round(w*k)),Math.max(1,Math.round(h*k))),
      poly:(pts)=>m.poly(pts.map(([x,y])=>[x*k,y*k])),
      limb:(x1,y1,x2,y2,r1,r2)=>m.limb(x1*k,y1*k,x2*k,y2*k,Math.max(0.6,r1*k),Math.max(0.6,r2*k)),
      px:(x,y)=>m.px(Math.floor(x*k),Math.floor(y*k))
    }),sep);
  }
  px(x,y,col){return super.px(Math.floor(x*this.k),Math.floor(y*this.k),col);}
  has(x,y){x=Math.floor(x*this.k);y=Math.floor(y*this.k);return x>=0&&y>=0&&x<this.w&&y<this.h&&!!this.c[y*this.w+x];}
}

/* Graf Nimmerjetzt: Grundmass 48 x 78, Fusspunkt (22,76), schaut nach rechts.
   o.walk/o.phase: Laufen, o.reach: greift nach vorn, o.sit: sitzt, o.carry: traegt die Unruh */
function makeGraf(o,k){
  const p=new PupK(48,78,k),ph=o.phase||0,walk=o.walk;
  const a=walk?Math.sin(ph*Math.PI*2):0,bob=walk?Math.round(Math.abs(Math.cos(ph*Math.PI*2))):0;
  const dy=(o.sit?10:0)+bob;
  // Stiefel aus Eisen unter dem Saum
  const boot=(fx,front)=>p.part(RAMP2.metal,m=>{m.ell(fx+1,73,4,2.4);m.rect(fx-2,67,5,6);},front);
  if(o.sit){boot(33,false);boot(38,true);}
  else{boot(20-a*5,false);boot(24+a*5,true);}
  // hinterer Arm
  p.part(['#12020a','#2a0810','#40101a','#661828'],m=>m.limb(17,24+dy,13+a*3,40+dy,3,2.6));
  p.part(RAMP2.metal,m=>m.ell(13+a*3,42+dy,2.4,2.4));
  // Morgenmantel mit ausgefranstem Saum
  const hem=o.sit?64:70;
  p.part(RAMP2.robe,m=>{
    m.poly([[14,20+dy],[31,20+dy],[33,34+dy],[36,hem],[8,hem],[12,34+dy]]);
    if(o.sit)m.ell(32,hem-3,7,4);
    for(let x=9;x<36;x+=4)m.poly([[x,hem-1],[x+2,hem+2+(x%8?1:0)],[x+4,hem-1]]);
  });
  // Guertel und Tasche
  p.part(['#12020a','#3a0c16','#8a2638','#b03448'],m=>{m.rect(12,40+dy,22,2);m.limb(27,42+dy,29,48+dy,0.8,0.7);});
  p.part(['#12020a','#40101a','#5a1624','#7a2232'],m=>m.rect(14,48+dy,6,6),true);
  // Ruestung blitzt am Hals hervor
  p.part(RAMP2.metal,m=>m.poly([[20,20+dy],[27,20+dy],[24,31+dy]]));
  // vorderer Arm
  if(o.reach){p.part(RAMP2.robe,m=>m.limb(26,24+dy,42,27+dy,3.2,2.8),true);p.part(RAMP2.metal,m=>{m.ell(45,27+dy,3,2.6);m.limb(46,25+dy,48,23+dy,0.8,0.8);m.limb(46,29+dy,48,31+dy,0.8,0.8);},true);}
  else if(o.carry){p.part(RAMP2.robe,m=>m.limb(27,24+dy,32,36+dy,3.2,2.8),true);p.part(RAMP2.metal,m=>m.ell(33,38+dy,2.8,2.6),true);}
  else{p.part(RAMP2.robe,m=>m.limb(27,24+dy,26,15+dy,3.2,2.8),true);p.part(RAMP2.metal,m=>m.ell(27,14+dy,3.2,3),true);}
  // Kapuze mit Zipfel, innen nur Schwaerze und zwei gluehende Augen
  p.part(RAMP2.robe,m=>{m.ell(22,12+dy,9.5,10);m.poly([[13,10+dy],[9,1+dy],[18,4+dy]]);});
  p.part(['#000000','#050308','#050308','#0c0810'],m=>m.ell(27,13+dy,4.6,6));
  if(!o.reach&&!o.carry)p.part(RAMP2.metal,m=>m.ell(28,15+dy,3,2.6),true);
  if(!o.blink){p.px(25,11+dy,RAMP2.eye).px(29,11+dy,RAMP2.eye);if(k>=0.6){p.px(26,11+dy,'#fff6c0').px(30,11+dy,'#fff6c0');}}
  return p.canvas();
}
/* Aufschiebchen in beliebiger Groesse: Grundmass 24 x 28, Fusspunkt (11,27) */
function makeImpK(o,k){
  const p=new PupK(24,28,k),ph=o.phase||0,walk=o.walk,b=walk?Math.round(Math.abs(Math.sin(ph*Math.PI*2))):0;
  const f=walk?Math.sin(ph*Math.PI*2)*2.5:0;
  p.part(RAMP.imp,m=>{m.limb(9,21-b,9-f,25,1.3,1.2);m.limb(13,21-b,13+f,25,1.3,1.2);});
  p.part(RAMP.white,m=>{m.ell(9-f,25.5,2.2,1.3);m.ell(13.5+f,25.5,2.2,1.3);},true);
  p.part(RAMP.paj,m=>m.ell(11,18-b,5,4.5));
  for(let x=7;x<16;x+=2)for(let y=15-b;y<22-b;y++)if(p.has(x,y))p.px(x,y,'#a8c8f0');
  p.part(RAMP.imp,m=>m.ell(11,9-b,6,5.8));
  p.part(RAMP.imp,m=>m.ell(17,10-b,2.1,2),true);
  p.part(RAMP.cap,m=>m.poly([[5,6-b],[16,4-b],[12,0-b],[4,2-b],[1,9-b]]));
  p.part(RAMP.white,m=>m.ell(1.6,10-b,1.7,1.7),true);
  if(o.sigh){p.px(13,8-b,'#3a2e48').px(14,8-b,'#3a2e48').px(13,12-b,'#3a2e48').px(14,12-b,'#3a2e48');}
  else{p.px(13,8-b,'#ffffff').px(14,8-b,'#101018').px(12,12-b,'#3a2e48').px(13,12-b,'#3a2e48');}
  p.part(RAMP.imp,m=>m.ell(o.push?19:16,o.push?15-b:17-b,1.6,1.6),true);
  return p.canvas();
}

const startEl=document.getElementById('start'),endEl=document.getElementById('end'),muteBtn=document.getElementById('mute');
function loop(){if(!playing)return;const t=now();if(t>=END){finish();return;}frame(Math.max(0,t));requestAnimationFrame(loop);}
function begin(){stopAudio();initAudio();perf0=performance.now();startEl.hidden=true;endEl.hidden=true;playing=true;requestAnimationFrame(loop);}
function finish(){playing=false;stopAudio();frame(63);endEl.hidden=false;}
// Weiter per Klick oder Taste: zum naechsten Satz, ans Ende des aktuellen Satzes oder zur naechsten Einstellung
const SCENES=[5,15,25,30.3,38,46,54.3,62,64];
const MARKS=[...new Set([...SCENES,...CAPS.flatMap(c=>[c[0],c[1]]),...SAYS.flatMap(q=>[q[0],q[1]]),END])].sort((a,b)=>a-b);
function seek(target){if(AC){t0=AC.currentTime-target+0.02;startBus();}else perf0=performance.now()-target*1000;}
function advance(){if(!playing)return;const t=now(),next=MARKS.find(m=>m>t+0.15);if(next==null||next>=END){finish();return;}seek(next);}
document.getElementById('screen').addEventListener('click',e=>{if(e.target.closest('button'))return;advance();});
document.addEventListener('keydown',e=>{if(!playing)return;if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();advance();}});
document.getElementById('play').addEventListener('click',begin);
document.getElementById('again').addEventListener('click',begin);
document.getElementById('skip').addEventListener('click',()=>{if(playing)finish();else if(!startEl.hidden){startEl.hidden=true;finish();}});
muteBtn.addEventListener('click',()=>{muted=!muted;if(M)M.gain.value=muted?0:0.55;muteBtn.textContent=muted?'Ton an':'Ton aus';muteBtn.setAttribute('aria-pressed',String(muted));});
NIGHT=drawNight();TOWER=drawTowerRoom();FOG=makeFog();buildNightSprites();buildTowerSprites();buildClassSprites();
frame(10);
window.__frame=t=>frame(t);window.__now=()=>playing?now():null;
})();
</script>
